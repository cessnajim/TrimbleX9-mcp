name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The floor in pyproject.toml. mcp 1.7 imports a private pydantic
          # helper that pydantic 2.14 removed, so pin pydantic with it.
          - python-version: "3.10"
            mcp: '"mcp==1.7.*" "pydantic<2.14"'
          - python-version: "3.10"
            mcp: '"mcp>=1.7,<2"'
          - python-version: "3.13"
            mcp: '"mcp>=2,<3"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest ${{ matrix.mcp }}
      - name: Entry point
        run: command -v trimblex9-mcp
      - run: pytest -q
      - name: Lint (non-gating)
        run: pip install ruff && ruff check . || true
